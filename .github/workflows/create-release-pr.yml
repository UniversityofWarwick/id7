name: Prepare Release PR

on:
  push:
    branches:
      - release/v*

jobs:
  prepare-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          # Extract version from release/vX.Y.Z
          VERSION="${BRANCH#release/v}"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          
          echo "📦 Detected version from branch: $VERSION"
          echo "🌿 Branch: $BRANCH"

      - name: Update version in package.json and _config.yml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Update package.json
          sed -i -E 's/"version": "[^"]+"/"version": "'$VERSION'"/' package.json
          echo "✓ Updated package.json to $VERSION"
          
          # Update _config.yml
          sed -i -E 's/current_version: [^ ]+/current_version: '$VERSION'/' _config.yml
          echo "✓ Updated _config.yml to $VERSION"

      - name: Verify version updates
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_VERSION=$(grep -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
          CONFIG_VERSION=$(grep 'current_version:' _config.yml | awk '{print $2}')
          
          echo "package.json version: $PKG_VERSION"
          echo "_config.yml version: $CONFIG_VERSION"
          
          if [ "$PKG_VERSION" != "$VERSION" ] || [ "$CONFIG_VERSION" != "$VERSION" ]; then
            echo "❌ Version update verification failed"
            exit 1
          fi
          
          echo "✓ Version updates verified"

      - name: Commit version updates
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet; then
            git add package.json _config.yml
            git commit -m "Release v$VERSION"
            echo "✓ Committed version bump"
          else
            echo "ℹ️  No changes to commit (version already up to date)"
          fi

      - name: Push version updates
        run: |
          BRANCH="${{ steps.version.outputs.branch }}"
          git push origin "$BRANCH"

      - name: Create or update pull request
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const branch = '${{ steps.version.outputs.branch }}';
            
            // Check for existing PR
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            
            if (prs.length > 0) {
              console.log(`✓ Pull request already exists: ${prs[0].html_url}`);
              core.setOutput('pr_url', prs[0].html_url);
              return;
            }
            
            // Create new PR
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release v${version}`,
              head: branch,
              base: 'main',
              body: `## Release v${version}\n\nThis PR bumps the version to v${version} and is ready for release.\n\n### Release Flow\nOnce CI passes and this PR is approved:\n1. A comment will be posted asking you to confirm the release\n2. Comment **/release** to trigger the release pipeline\n3. GitHub Actions will:\n   - Create a GitHub release with tag \`v${version}\`\n   - Build production artifacts\n   - Upload assets to the release\n   - Publish to npmjs.org\n   - Automatically merge this PR\n\nThis allows us to see and verify the successful build before finalizing the release.\n\n**Important:** Review the version number before approving!`,
              draft: false,
            });
            
            console.log(`✓ Pull request created: ${pr.html_url}`);
            core.setOutput('pr_url', pr.html_url);

